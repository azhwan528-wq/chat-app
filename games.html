<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 بازی‌ها</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: #0a0e27;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(120, 0, 255, 0.2), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0, 255, 200, 0.2), transparent 50%);
    min-height: 100vh;
    color: white;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
    background: linear-gradient(135deg, #00ffcc, #ff00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 25px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: #00ffcc;
    box-shadow: 0 10px 40px rgba(0, 255, 204, 0.2);
  }
  .card .icon { font-size: 50px; margin-bottom: 15px; }
  .card h3 { font-size: 20px; margin-bottom: 8px; color: #00ffcc; }
  .card p { font-size: 13px; color: #aaa; }

  #game-area {
    display: none;
    max-width: 700px;
    margin: 0 auto;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 25px;
    text-align: center;
  }
  #game-area.active { display: block; }
  #game-title { font-size: 24px; margin-bottom: 20px; color: #00ffcc; }
  #back-btn {
    margin-bottom: 20px;
    padding: 8px 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }

  /* 2048 */
  #g2048-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 400px;
    margin: 0 auto;
    background: #2c3e50;
    padding: 10px;
    border-radius: 10px;
  }
  .tile-2048 {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    border-radius: 6px;
    color: #fff;
  }

  /* Memory */
  #mem-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }
  .mem-card {
    aspect-ratio: 1;
    background: #2c3e50;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    cursor: pointer;
    transition: all 0.3s;
    user-select: none;
  }
  .mem-card.flipped { background: #00cc99; color: white; }
  .mem-card.matched { background: #27ae60; opacity: 0.6; }

  /* TicTacToe */
  #ttt-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    max-width: 300px;
    margin: 0 auto;
  }
  .ttt-cell {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    cursor: pointer;
    color: #fff;
  }
  .ttt-cell:hover { background: rgba(255,255,255,0.15); }

  /* RPS */
  .rps-btn {
    padding: 20px 30px;
    font-size: 40px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 15px;
    cursor: pointer;
    margin: 5px;
  }
  .rps-btn:hover { background: rgba(0,255,204,0.2); }

  /* Simon */
  #simon-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 300px;
    margin: 0 auto;
  }
  .simon-btn {
    aspect-ratio: 1;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.6;
  }
  .simon-btn.active { opacity: 1; box-shadow: 0 0 30px currentColor; transform: scale(0.95); }

  /* Minesweeper */
  #ms-grid {
    display: grid;
    gap: 2px;
    margin: 0 auto;
    justify-content: center;
  }
  .ms-cell {
    width: 30px;
    height: 30px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
  }
  .ms-cell.revealed { background: rgba(0,0,0,0.3); cursor: default; }
  .ms-cell.mine { background: #e74c3c; }

  .info { margin: 15px 0; font-size: 16px; color: #ffcc00; font-weight: bold; }
  .btn-new {
    padding: 12px 25px;
    background: linear-gradient(135deg, #00ffcc, #00cc99);
    color: #050818;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h1>🎮 بازی‌ها</h1>

<div class="grid" id="hub">
  <div class="card" onclick="window.location.href='snake.html'">
    <div class="icon">🐍</div>
    <h3>مار</h3>
    <p>مار نئون با امتیاز طلایی</p>
  </div>
  <div class="card" onclick="openGame('g2048')">
    <div class="icon">🔢</div>
    <h3>۲۰۴۸</h3>
    <p>اعداد رو ترکیب کن</p>
  </div>
  <div class="card" onclick="openGame('memory')">
    <div class="icon">🧠</div>
    <h3>بازی حافظه</h3>
    <p>جفت‌ها رو پیدا کن</p>
  </div>
  <div class="card" onclick="openGame('ttt')">
    <div class="icon">⭕</div>
    <h3>دوز</h3>
    <p>سه‌تا در یک ردیف</p>
  </div>
  <div class="card" onclick="openGame('rps')">
    <div class="icon">✊</div>
    <h3>سنگ کاغذ قیچی</h3>
    <p>با کامپیوتر بازی کن</p>
  </div>
  <div class="card" onclick="openGame('simon')">
    <div class="icon">🎵</div>
    <h3>سایمون</h3>
    <p>الگو رو تکرار کن</p>
  </div>
  <div class="card" onclick="openGame('minesweeper')">
    <div class="icon">💣</div>
    <h3>مین‌یاب</h3>
    <p>از مین‌ها دوری کن</p>
  </div>
</div>

<div id="game-area">
  <button id="back-btn" onclick="closeGame()">← بازگشت به بازی‌ها</button>
  <h2 id="game-title"></h2>
  <div id="game-content"></div>
</div>

<script>
function openGame(id) {
  document.getElementById("hub").style.display = "none";
  document.getElementById("game-area").classList.add("active");
  const content = document.getElementById("game-content");
  content.innerHTML = "";
  document.getElementById("game-title").textContent = "";

  if (id === "g2048") init2048(content);
  else if (id === "memory") initMemory(content);
  else if (id === "ttt") initTTT(content);
  else if (id === "rps") initRPS(content);
  else if (id === "simon") initSimon(content);
  else if (id === "minesweeper") initMinesweeper(content);
}

function closeGame() {
  document.getElementById("hub").style.display = "grid";
  document.getElementById("game-area").classList.remove("active");
}

// ==================== 2048 ====================
function init2048(el) {
  document.getElementById("game-title").textContent = "🔢 ۲۰۴۸";
  el.innerHTML = `
    <div class="info">امتیاز: <span id="s2048">0</span></div>
    <div id="g2048-grid"></div>
    <button class="btn-new" onclick="start2048()">شروع دوباره</button>
    <p style="margin-top:15px;color:#888;font-size:12px;">با کلیدهای جهت‌دار حرکت کن</p>
  `;
  start2048();
}
let grid2048, score2048;
function start2048() {
  grid2048 = Array(4).fill(0).map(() => Array(4).fill(0));
  score2048 = 0;
  document.getElementById("s2048").textContent = 0;
  addRandom2048();
  addRandom2048();
  draw2048();
}
function addRandom2048() {
  const empty = [];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++)
    if (grid2048[i][j] === 0) empty.push([i, j]);
  if (empty.length === 0) return;
  const [i, j] = empty[Math.floor(Math.random() * empty.length)];
  grid2048[i][j] = Math.random() < 0.9 ? 2 : 4;
}
function draw2048() {
  const colors = {
    0: "#2c3e50", 2: "#3498db", 4: "#2980b9", 8: "#1abc9c",
    16: "#16a085", 32: "#27ae60", 64: "#229954", 128: "#f1c40f",
    256: "#f39c12", 512: "#e67e22", 1024: "#e74c3c", 2048: "#9b59b6"
  };
  const g = document.getElementById("g2048-grid");
  g.innerHTML = "";
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const d = document.createElement("div");
    d.className = "tile-2048";
    d.style.background = colors[grid2048[i][j]] || "#9b59b6";
    d.textContent = grid2048[i][j] || "";
    g.appendChild(d);
  }
}
function move2048(dir) {
  const before = JSON.stringify(grid2048);
  let moved = false;
  const rotate = (m) => m[0].map((_, i) => m.map(r => r[i]).reverse());
  for (let k = 0; k < dir; k++) grid2048 = rotate(grid2048);
  for (let i = 0; i < 4; i++) {
    let row = grid2048[i].filter(x => x);
    for (let j = 0; j < row.length - 1; j++) {
      if (row[j] === row[j + 1]) { row[j] *= 2; score2048 += row[j]; row.splice(j + 1, 1); }
    }
    while (row.length < 4) row.push(0);
    grid2048[i] = row;
  }
  for (let k = 0; k < (4 - dir) % 4; k++) grid2048 = rotate(grid2048);
  if (JSON.stringify(grid2048) !== before) { moved = true; addRandom2048(); }
  document.getElementById("s2048").textContent = score2048;
  draw2048();
}
document.addEventListener("keydown", e => {
  if (!document.getElementById("g2048-grid")) return;
  if (e.key === "ArrowLeft") { move2048(3); e.preventDefault(); }
  else if (e.key === "ArrowRight") { move2048(1); e.preventDefault(); }
  else if (e.key === "ArrowUp") { move2048(0); e.preventDefault(); }
  else if (e.key === "ArrowDown") { move2048(2); e.preventDefault(); }
});

// ==================== Memory ====================
function initMemory(el) {
  document.getElementById("game-title").textContent = "🧠 بازی حافظه";
  el.innerHTML = `
    <div class="info">حرکت: <span id="mem-moves">0</span></div>
    <div id="mem-grid"></div>
    <button class="btn-new" onclick="initMemory(document.getElementById('game-content'))">شروع دوباره</button>
  `;
  const icons = ["🍎","🍌","🍇","🍓","🍒","🍑","🍉","🥝"];
  const cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
  const grid = document.getElementById("mem-grid");
  let flipped = [], matched = 0, moves = 0, lock = false;
  grid.innerHTML = "";
  cards.forEach(icon => {
    const c = document.createElement("div");
    c.className = "mem-card";
    c.textContent = "";
    c.dataset.icon = icon;
    c.onclick = () => {
      if (lock || c.classList.contains("flipped") || c.classList.contains("matched")) return;
      c.classList.add("flipped");
      c.textContent = icon;
      flipped.push(c);
      if (flipped.length === 2) {
        lock = true; moves++;
        document.getElementById("mem-moves").textContent = moves;
        if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
          flipped.forEach(x => { x.classList.add("matched"); x.classList.remove("flipped"); });
          matched += 2;
          flipped = []; lock = false;
          if (matched === cards.length) setTimeout(() => alert(`🎉 بردی! در ${moves} حرکت`), 300);
        } else {
          setTimeout(() => {
            flipped.forEach(x => { x.classList.remove("flipped"); x.textContent = ""; });
            flipped = []; lock = false;
          }, 800);
        }
      }
    };
    grid.appendChild(c);
  });
}

// ==================== TicTacToe ====================
function initTTT(el) {
  document.getElementById("game-title").textContent = "⭕ دوز (X شما، O کامپیوتر)";
  el.innerHTML = `
    <div class="info" id="ttt-status">نوبت شما (X)</div>
    <div id="ttt-grid"></div>
    <button class="btn-new" onclick="initTTT(document.getElementById('game-content'))">شروع دوباره</button>
  `;
  let board = Array(9).fill("");
  let current = "X";
  const grid = document.getElementById("ttt-grid");
  grid.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const c = document.createElement("div");
    c.className = "ttt-cell";
    c.dataset.idx = i;
    c.onclick = () => playTTT(i);
    grid.appendChild(c);
  }
  function draw() {
    grid.querySelectorAll(".ttt-cell").forEach((c, i) => {
      c.textContent = board[i];
      c.style.color = board[i] === "X" ? "#00ffcc" : "#ff00aa";
    });
  }
  function win(b) {
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const [a,b1,c] of lines) if (b[a] && b[a]===b[b1] && b[a]===b[c]) return b[a];
    return b.every(x => x) ? "draw" : null;
  }
  function playTTT(i) {
    if (board[i] || current !== "X") return;
    board[i] = "X"; current = "O"; draw();
    let w = win(board);
    if (w) return endTTT(w);
    setTimeout(() => {
      // کامپیوتر ساده
      const empty = board.map((v, j) => v ? null : j).filter(v => v !== null);
      if (empty.length) {
        const ai = empty[Math.floor(Math.random() * empty.length)];
        board[ai] = "O"; current = "X"; draw();
        let w2 = win(board);
        if (w2) endTTT(w2);
      }
    }, 300);
  }
  function endTTT(w) {
    const s = document.getElementById("ttt-status");
    if (w === "X") s.textContent = "🎉 شما بردید!";
    else if (w === "O") s.textContent = "😢 کامپیوتر برد";
    else s.textContent = "🤝 مساوی";
    grid.querySelectorAll(".ttt-cell").forEach(c => c.onclick = null);
  }
}

// ==================== RPS ====================
function initRPS(el) {
  document.getElementById("game-title").textContent = "✊ سنگ کاغذ قیچی";
  el.innerHTML = `
    <div style="display:flex;justify-content:center;gap:10px;margin:20px 0;">
      <button class="rps-btn" onclick="playRPS('rock')">✊</button>
      <button class="rps-btn" onclick="playRPS('paper')">✋</button>
      <button class="rps-btn" onclick="playRPS('scissors')">✌️</button>
    </div>
    <div class="info" id="rps-result">یک انتخاب کن!</div>
    <div class="info" id="rps-score">شما: 0 | کامپیوتر: 0</div>
    <button class="btn-new" onclick="scoreRPS={you:0,ai:0};document.getElementById('rps-score').textContent='شما: 0 | کامپیوتر: 0'">ریست</button>
  `;
  window.scoreRPS = { you: 0, ai: 0 };
}
function playRPS(you) {
  const opts = ["rock","paper","scissors"];
  const ai = opts[Math.floor(Math.random() * 3)];
  const emoji = { rock: "✊", paper: "✋", scissors: "✌️" };
  let r;
  if (you === ai) r = "🤝 مساوی";
  else if ((you === "rock" && ai === "scissors") || (you === "paper" && ai === "rock") || (you === "scissors" && ai === "paper")) {
    r = "🎉 شما بردید"; window.scoreRPS.you++;
  } else {
    r = "😢 کامپیوتر برد"; window.scoreRPS.ai++;
  }
  document.getElementById("rps-result").textContent = `${emoji[you]} vs ${emoji[ai]} — ${r}`;
  document.getElementById("rps-score").textContent = `شما: ${window.scoreRPS.you} | کامپیوتر: ${window.scoreRPS.ai}`;
}

// ==================== Simon ====================
function initSimon(el) {
  document.getElementById("game-title").textContent = "🎵 سایمون — الگو رو تکرار کن";
  el.innerHTML = `
    <div class="info" id="simon-status">دکمه شروع رو بزن</div>
    <div id="simon-grid">
      <div class="simon-btn" style="background:#e74c3c;color:#e74c3c;" data-c="0"></div>
      <div class="simon-btn" style="background:#3498db;color:#3498db;" data-c="1"></div>
      <div class="simon-btn" style="background:#27ae60;color:#27ae60;" data-c="2"></div>
      <div class="simon-btn" style="background:#f1c40f;color:#f1c40f;" data-c="3"></div>
    </div>
    <button class="btn-new" onclick="startSimon()">شروع</button>
  `;
  document.querySelectorAll(".simon-btn").forEach(b => b.onclick = () => clickSimon(parseInt(b.dataset.c)));
}
let simonSeq, simonIdx, simonPlaying, simonRound;
function startSimon() {
  simonSeq = []; simonIdx = 0; simonRound = 0;
  document.getElementById("simon-status").textContent = "آماده...";
  nextSimonRound();
}
function nextSimonRound() {
  simonRound++;
  simonIdx = 0;
  simonSeq.push(Math.floor(Math.random() * 4));
  document.getElementById("simon-status").textContent = `مرحله ${simonRound}`;
  playSimonSeq();
}
function playSimonSeq() {
  simonPlaying = true;
  let i = 0;
  const btns = document.querySelectorAll(".simon-btn");
  const interval = setInterval(() => {
    if (i >= simonSeq.length) {
      clearInterval(interval);
      simonPlaying = false;
      return;
    }
    const b = btns[simonSeq[i]];
    b.classList.add("active");
    setTimeout(() => b.classList.remove("active"), 300);
    i++;
  }, 600);
}
function clickSimon(c) {
  if (simonPlaying || !simonSeq) return;
  const btns = document.querySelectorAll(".simon-btn");
  const b = btns[c];
  b.classList.add("active");
  setTimeout(() => b.classList.remove("active"), 200);

  if (simonSeq[simonIdx] === c) {
    simonIdx++;
    if (simonIdx === simonSeq.length) {
      setTimeout(nextSimonRound, 700);
    }
  } else {
    document.getElementById("simon-status").textContent = `💀 باخت! مرحله ${simonRound}`;
    simonSeq = null;
  }
}

// ==================== Minesweeper ====================
function initMinesweeper(el) {
  document.getElementById("game-title").textContent = "💣 مین‌یاب (۱۰×۱۰)";
  el.innerHTML = `
    <div class="info" id="ms-status">روی خانه‌ها کلیک کن</div>
    <div id="ms-grid"></div>
    <button class="btn-new" onclick="initMinesweeper(document.getElementById('game-content'))">شروع دوباره</button>
  `;
  const SIZE = 10, MINES = 15;
  const grid = document.getElementById("ms-grid");
  grid.style.gridTemplateColumns = `repeat(${SIZE}, 30px)`;
  const board = [];
  for (let i = 0; i < SIZE * SIZE; i++) board.push({ mine: false, revealed: false, num: 0 });
  let placed = 0;
  while (placed < MINES) {
    const idx = Math.floor(Math.random() * SIZE * SIZE);
    if (!board[idx].mine) { board[idx].mine = true; placed++; }
  }
  for (let i = 0; i < SIZE * SIZE; i++) {
    if (board[i].mine) continue;
    let n = 0;
    const r = Math.floor(i / SIZE), c = i % SIZE;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr * SIZE + nc].mine) n++;
    }
    board[i].num = n;
  }
  grid.innerHTML = "";
  board.forEach((cell, i) => {
    const d = document.createElement("div");
    d.className = "ms-cell";
    d.onclick = () => reveal(i);
    grid.appendChild(d);
  });
  function reveal(i) {
    const cell = board[i];
    if (cell.revealed) return;
    cell.revealed = true;
    const d = grid.children[i];
    d.classList.add("revealed");
    if (cell.mine) {
      d.textContent = "💣"; d.classList.add("mine");
      document.getElementById("ms-status").textContent = "💥 بوم! باختی";
      board.forEach((c, j) => { if (c.mine) grid.children[j].textContent = "💣"; });
      return;
    }
    if (cell.num > 0) {
      d.textContent = cell.num;
      d.style.color = ["", "#3498db", "#27ae60", "#e74c3c", "#9b59b6", "#f39c12", "#16a085", "#8e44ad", "#2c3e50"][cell.num];
    }
    if (cell.num === 0) {
      const r = Math.floor(i / SIZE), c = i % SIZE;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) reveal(nr * SIZE + nc);
      }
    }
  }
}
</script>
</body>
</html>
