<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 مار</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Tahoma, sans-serif;
    background: #0a0e27;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(120, 0, 255, 0.15), transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(0, 255, 200, 0.15), transparent 50%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
  }

  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 20px;
  }

  #top-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 500px;
    padding: 0 10px;
    gap: 15px;
  }

  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 15px;
    font-size: 14px;
    backdrop-filter: blur(10px);
  }

  .stat span { color: #00ffcc; font-weight: bold; }

  #score { color: #00ffcc; }
  #best  { color: #ffcc00; }
  #level { color: #ff00aa; }

  #canvas-wrapper {
    position: relative;
    border-radius: 20px;
    padding: 3px;
    background: linear-gradient(135deg, #00ffcc, #ff00aa, #7700ff);
    box-shadow: 
      0 0 40px rgba(0, 255, 204, 0.4),
      0 0 80px rgba(255, 0, 170, 0.3);
  }

  canvas {
    display: block;
    border-radius: 18px;
    background: #050818;
    touch-action: none;
  }

  #controls {
    display: flex;
    gap: 10px;
    margin-top: 5px;
  }

  .btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { background: rgba(255,255,255,0.15); }
  .btn:active { transform: scale(0.95); }

  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: rgba(5, 8, 24, 0.92);
    border-radius: 18px;
    text-align: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }

  #overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #overlay h2 {
    font-size: 32px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #00ffcc, #ff00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #overlay p {
    font-size: 16px;
    color: #aaa;
    margin-bottom: 20px;
  }

  #overlay .final-score {
    font-size: 48px;
    color: #00ffcc;
    font-weight: bold;
    margin: 15px 0;
  }

  #overlay .btn-big {
    padding: 15px 40px;
    font-size: 18px;
    background: linear-gradient(135deg, #00ffcc, #00cc99);
    color: #050818;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }

  #overlay .btn-big:hover { transform: scale(1.05); }

  #mobile-hint {
    color: #666;
    font-size: 12px;
    text-align: center;
    margin-top: 5px;
  }

  @media (max-width: 500px) {
    #overlay h2 { font-size: 24px; }
    #overlay .final-score { font-size: 36px; }
    .stat { font-size: 12px; padding: 6px 10px; }
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="top-bar">
    <div class="stat">امتیاز: <span id="score">۰</span></div>
    <div class="stat">سطح: <span id="level">۱</span></div>
    <div class="stat">رکورد: <span id="best">۰</span></div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="500" height="500"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">🐍</h2>
      <p id="overlay-text">برای شروع دکمه رو بزن</p>
      <div class="final-score" id="overlay-score" style="display:none;"></div>
      <button class="btn-big" id="overlay-btn" onclick="startGame()">شروع بازی</button>
    </div>
  </div>

  <div id="controls">
    <button class="btn" onclick="togglePause()">⏸ توقف</button>
    <button class="btn" onclick="startGame()">🔄 شروع دوباره</button>
  </div>

  <div id="mobile-hint">📱 برای حرکت، انگشتت رو روی صفحه بکش</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const overlayScore = document.getElementById('overlay-score');
const overlayBtn = document.getElementById('overlay-btn');

const GRID = 20;
const CELL = canvas.width / GRID;

let snake, dir, nextDir, food, score, best, level, speed, gameLoop, paused, isGameOver;

best = parseInt(localStorage.getItem('snake_best') || '0');
document.getElementById('best').textContent = toPersian(best);

function toPersian(num) {
  return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

// ---------- ذخیره رکورد ----------
function updateBest() {
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best', best);
    document.getElementById('best').textContent = toPersian(best);
  }
}

// ---------- غذا ----------
function randomFood() {
  let pos;
  const isGolden = Math.random() < 0.15; // ۱۵٪ طلایی
  do {
    pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return { ...pos, golden: isGolden };
}

// ---------- شروع ----------
function startGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  level = 1;
  speed = 130;
  paused = false;
  isGameOver = false;
  food = randomFood();
  updateUI();
  overlay.classList.remove('show');
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
}

function updateUI() {
  document.getElementById('score').textContent = toPersian(score);
  document.getElementById('level').textContent = toPersian(level);
}

// ---------- گام ----------
function tick() {
  if (paused) return;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // برخورد با دیوار
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    return gameOver();
  }
  // برخورد با خود
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  // خوردن غذا
  if (head.x === food.x && head.y === food.y) {
    const points = food.golden ? 30 : 10;
    score += points;
    updateUI();

    // سطح‌بندی: هر ۵۰ امتیاز، سطح بالا، سرعت بیشتر
    const newLevel = Math.floor(score / 50) + 1;
    if (newLevel > level) {
      level = newLevel;
      speed = Math.max(50, 130 - (level - 1) * 10);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }

    food = randomFood();
  } else {
    snake.pop();
  }

  updateBest();
  draw();
}

// ---------- رسم ----------
function draw() {
  // پس‌زمینه
  ctx.fillStyle = '#050818';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // شبکه‌ی کم‌رنگ
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // غذا
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  ctx.save();
  ctx.shadowColor = food.golden ? '#ffcc00' : '#ff3366';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(fx, fy, CELL * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = food.golden ? '#ffcc00' : '#ff3366';
  ctx.fill();
  ctx.restore();

  // مار
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const t = i / snake.length;
    // گرادیانت رنگی
    const r = Math.floor(0 + 255 * t);
    const g = Math.floor(255 - 100 * t);
    const b = Math.floor(204 - 100 * t);
    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

    if (i === 0) {
      // سر
      ctx.shadowColor = '#00ffcc';
      ctx.shadowBlur = 15;
    } else {
      ctx.shadowBlur = 5;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.5)`;
    }

    const pad = i === 0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(
      s.x * CELL + pad,
      s.y * CELL + pad,
      CELL - pad * 2,
      CELL - pad * 2,
      i === 0 ? 8 : 5
    );
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // چشم‌های سر
  if (snake.length > 0) {
    const head = snake[0];
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    ctx.fillStyle = '#050818';
    const eyeOffset = 3;
    let ex1, ey1, ex2, ey2;
    if (dir.x === 1) { ex1 = cx + eyeOffset; ey1 = cy - 3; ex2 = cx + eyeOffset; ey2 = cy + 3; }
    else if (dir.x === -1) { ex1 = cx - eyeOffset; ey1 = cy - 3; ex2 = cx - eyeOffset; ey2 = cy + 3; }
    else if (dir.y === 1) { ex1 = cx - 3; ey1 = cy + eyeOffset; ex2 = cx + 3; ey2 = cy + eyeOffset; }
    else { ex1 = cx - 3; ey1 = cy - eyeOffset; ex2 = cx + 3; ey2 = cy - eyeOffset; }
    ctx.beginPath();
    ctx.arc(ex1, ey1, 2, 0, Math.PI * 2);
    ctx.arc(ex2, ey2, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// پشتیبانی از roundRect
if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

// ---------- پایان ----------
function gameOver() {
  clearInterval(gameLoop);
  isGameOver = true;
  updateBest();
  overlayTitle.textContent = '💀 Game Over';
  overlayText.textContent = 'دوباره تلاش کن!';
  overlayScore.style.display = 'block';
  overlayScore.textContent = 'امتیاز: ' + toPersian(score);
  overlayBtn.textContent = '🔄 بازی دوباره';
  overlay.classList.add('show');
  // لرزش گوشی
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
}

// ---------- pause ----------
function togglePause() {
  if (isGameOver) return;
  paused = !paused;
  if (paused) {
    overlayTitle.textContent = '⏸ توقف';
    overlayText.textContent = 'برای ادامه دکمه رو بزن';
    overlayScore.style.display = 'none';
    overlayBtn.textContent = '▶ ادامه';
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
  }
}

overlayBtn.addEventListener('click', () => {
  if (paused) togglePause();
  else startGame();
});

// ---------- کیبورد ----------
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(key)) {
    e.preventDefault();
  }
  if ((key === 'ArrowUp' || key === 'w') && dir.y !== 1) nextDir = { x: 0, y: -1 };
  else if ((key === 'ArrowDown' || key === 's') && dir.y !== -1) nextDir = { x: 0, y: 1 };
  else if ((key === 'ArrowLeft' || key === 'a') && dir.x !== 1) nextDir = { x: -1, y: 0 };
  else if ((key === 'ArrowRight' || key === 'd') && dir.x !== -1) nextDir = { x: 1, y: 0 };
  else if (key === ' ') togglePause();
});

// ---------- لمسی ----------
let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (!touchStart) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
    else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
    else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
  }
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

canvas.addEventListener('touchend', () => { touchStart = null; });

// ---------- شروع اولیه ----------
draw();
overlay.classList.add('show');
overlayTitle.textContent = '🐍 مار';
overlayText.textContent = 'ساده شروع کن، حرفه‌ای تموم کن!';
overlayBtn.textContent = 'شروع بازی';
</script>
</body>
</html>
