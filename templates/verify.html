<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان آوا | تایید</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; width: 100%; max-width: 400px; padding: 40px 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 50px; margin-bottom: 10px; }
        input { width: 60%; padding: 15px; margin: 20px 0; border: none; border-bottom: 2px solid #5b9bd5; font-size: 24px; text-align: center; letter-spacing: 5px; outline: none; direction: ltr; }
        .btn { background: #5b9bd5; color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 16px; cursor: pointer; font-family: 'Tahoma'; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✉️</div>
        <h2>کد را وارد کنید</h2>
        <p>ایمیلی حاوی کد فعال‌سازی به آدرس شما ارسال شده است.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="code" maxlength="6" placeholder="------" required>
            <br><br>
            <button type="submit" class="btn">تایید</button>
        </form>
        <br>
        <a href="/" style="color: #888; text-decoration: none; font-size: 14px;">تغییر ایمیل و شماره</a>
    </div>
</body>
</html>
