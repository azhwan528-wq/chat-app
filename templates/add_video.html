<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افزودن ویدیو | آوا</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; margin: 0; }
        .header { background-color: #5b9bd5; color: white; padding: 15px; display: flex; align-items: center; }
        .header a { color: white; text-decoration: none; font-size: 24px; margin-left: 15px; }
        .form-container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .input-group { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: 'Tahoma'; direction: ltr; }
        .btn-submit { width: 100%; padding: 15px; background: #5b9bd5; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-family: 'Tahoma'; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .help-text { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/videos">&#8592;</a>
        <h1>افزودن ویدیو از آپارات</h1>
    </div>
    <div class="form-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        
        <form method="POST">
            <div class="input-group">
                <label>عنوان ویدیو</label>
                <input type="text" name="title" placeholder="مثلاً: آموزش پایتون" required>
            </div>
            <div class="input-group">
                <label>لینک ویدیو آپارات</label>
                <input type="url" name="video_url" placeholder="https://www.aparat.com/v/xxxxx" required>
                <p class="help-text">لینک رو از صفحه ویدیوی آپارات کپی کنید.</p>
            </div>
            <button type="submit" class="btn-submit">ذخیره ویدیو</button>
        </form>
    </div>
</body>
</html>
