<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل {{ user['display_name'] }}</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; margin: 0; }
        .header { background-color: #5b9bd5; color: white; padding: 15px; display: flex; align-items: center; }
        .header a { color: white; text-decoration: none; font-size: 24px; margin-left: 15px; }
        .profile-box { text-align: center; padding: 30px; background: white; margin: 15px; border-radius: 15px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #5b9bd5; color: white; display: inline-flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 15px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 22px; font-weight: bold; color: #333; margin: 0; }
        .username { color: #777; font-size: 16px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/search?q={{ user['username'] }}">&#8592;</a>
        <h2 style="margin:0; font-size: 18px;">پروفایل کاربر</h2>
    </div>
    <div class="profile-box">
        <div class="avatar">
            {% if user['profile_pic'] %}
                <img src="{{ url_for('static', filename='uploads/' + user['profile_pic']) }}">
            {% else %}
                {{ user['email'][0] | upper }}
            {% endif %}
        </div>
        <h1 class="name">{{ user['display_name'] or 'بدون نام' }}</h1>
        <p class="username">@{{ user['username'] }}</p>
    </div>
</body>
</html>
