<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت {{ 'گروه' if type == 'group' else 'کانال' }}</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header { background-color: #5b9bd5; color: white; padding: 15px; display: flex; align-items: center; }
        .header a { color: white; text-decoration: none; font-size: 24px; margin-left: 15px; }
        .form-container { padding: 20px; }
        .input-group { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; }
        .input-group input[type="text"], .input-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: 'Tahoma'; }
        .radio-group { display: flex; flex-direction: column; gap: 10px; }
        .radio-item { background: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-submit { width: 100%; padding: 15px; background: #5b9bd5; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/home">&#8592;</a>
        <h1>ساخت {{ 'گروه جدید' if type == 'group' else 'کانال جدید' }}</h1>
    </div>
    <div class="form-container">
        <form method="POST" enctype="multipart/form-data">
            <div class="input-group">
                <label>عکس پروفایل (اختیاری)</label>
                <input type="file" name="profile_pic" accept="image/*">
            </div>
            <div class="input-group">
                <label>نام {{ 'گروه' if type == 'group' else 'کانال' }}</label>
                <input type="text" name="name" placeholder="نام را وارد کنید..." required>
            </div>
            <div class="input-group">
                <label>توضیحات (اختیاری)</label>
                <textarea name="description" rows="3" placeholder="توضیحات..."></textarea>
            </div>
            <div class="radio-group">
                <div class="radio-item">
                    <label for="public">{{ 'گروه' if type == 'group' else 'کانال' }} عمومی (در جستجو پیدا می‌شود)</label>
                    <input type="radio" name="is_private" value="0" id="public" checked>
                </div>
                <div class="radio-item">
                    <label for="private">{{ 'گروه' if type == 'group' else 'کانال' }} خصوصی (فقط با لینک دعوت)</label>
                    <input type="radio" name="is_private" value="1" id="private">
                </div>
            </div>
            <button type="submit" class="btn-submit">ایجاد {{ 'گروه' if type == 'group' else 'کانال' }}</button>
        </form>
    </div>
</body>
              </html>
