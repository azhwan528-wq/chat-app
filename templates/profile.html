<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; margin: 0; }
        .header { background-color: #5b9bd5; color: white; padding: 15px; display: flex; align-items: center; }
        .header a { color: white; text-decoration: none; font-size: 24px; margin-left: 15px; }
        .form-container { padding: 20px; }
        .input-group { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: 'Tahoma'; }
        .btn-submit { width: 100%; padding: 15px; background: #5b9bd5; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/home">&#8592;</a>
        <h1>ویرایش پروفایل</h1>
    </div>
    <div class="form-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <div class="input-group">
                <label>عکس پروفایل (اختیاری)</label>
                <input type="file" name="profile_pic" accept="image/*">
            </div>
            <div class="input-group">
                <label>نام نمایشی</label>
                <input type="text" name="display_name" value="{{ user['display_name'] or '' }}" placeholder="مثلا: علی رضایی">
            </div>
            <div class="input-group">
                <label>آیدی اختصاصی (انگلیسی)</label>
                <input type="text" name="username" value="{{ user['username'] or '' }}" placeholder="مثلا: ali_rezaei" dir="ltr">
            </div>
            <button type="submit" class="btn-submit">ذخیره تغییرات</button>
        </form>
    </div>
</body>
</html>
