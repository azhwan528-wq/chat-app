<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: #e5ddd5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #login {
    background: white;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    text-align: center;
    width: 320px;
  }
  #login h1 { color: #075e54; margin-bottom: 20px; font-size: 22px; }
  #login input {
    width: 100%; padding: 12px;
    border: 2px solid #ddd; border-radius: 8px;
    font-size: 15px; margin-bottom: 15px;
    outline: none; font-family: inherit;
  }
  #login input:focus { border-color: #25d366; }
  #login button {
    width: 100%; padding: 12px;
    background: #25d366; color: white;
    border: none; border-radius: 8px;
    font-size: 16px; cursor: pointer;
    font-family: inherit; font-weight: bold;
  }
  #chat {
    display: none; flex-direction: column;
    width: 100%; max-width: 600px;
    height: 100vh; background: #efeae2;
  }
  #header {
    background: #075e54; color: white;
    padding: 15px 20px; font-size: 18px;
    font-weight: bold;
    display: flex; justify-content: space-between;
    align-items: center;
  }
  #header small { font-size: 12px; opacity: 0.8; font-weight: normal; }
  #messages {
    flex: 1; overflow-y: auto;
    padding: 15px; display: flex;
    flex-direction: column; gap: 8px;
  }
  .msg {
    max-width: 75%; padding: 8px 12px;
    border-radius: 10px; font-size: 14px;
    word-wrap: break-word; line-height: 1.4;
  }
  .msg.other { background: white; align-self: flex-start; border-top-left-radius: 2px; }
  .msg.mine  { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 2px; }
  .msg .name { font-size: 12px; color: #075e54; font-weight: bold; margin-bottom: 3px; }
  .msg .time { font-size: 10px; color: #999; margin-top: 3px; text-align: left; }
  .system {
    align-self: center; background: rgba(0,0,0,0.1);
    color: #555; padding: 5px 12px;
    border-radius: 15px; font-size: 12px;
  }
  #input-area {
    display: flex; padding: 10px;
    background: #f0f0f0; gap: 8px;
  }
  #input-area input {
    flex: 1; padding: 12px;
    border: none; border-radius: 20px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  #input-area button {
    padding: 0 20px; background: #25d366;
    color: white; border: none; border-radius: 20px;
    font-size: 14px; cursor: pointer;
    font-family: inherit; font-weight: bold;
  }
</style>
</head>
<body>

<div id="login">
  <h1>💬 چت</h1>
  <input id="username" placeholder="اسمت رو وارد کن..." maxlength="20">
  <button onclick="startChat()">ورود به چت</button>
</div>

<div id="chat">
  <div id="header">
    <span>💬 چت عمومی</span>
    <small id="status">در حال اتصال...</small>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <input id="msg-input" placeholder="پیامت رو بنویس..." disabled>
    <button id="send-btn" onclick="sendMessage()" disabled>ارسال</button>
  </div>
</div>

<script>
let ws = null;
let myUsername = "";

function startChat() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("اسمت رو وارد کن!");
  myUsername = name;
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  connect();
}

function connect() {
  // همون پورت و همون میزبان (بدون تغییر)
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(myUsername)}`);

  ws.onopen = () => {
    document.getElementById("status").textContent = "آنلاین ✅";
    document.getElementById("msg-input").disabled = false;
    document.getElementById("send-btn").disabled = false;
    document.getElementById("msg-input").focus();
  };
  ws.onmessage = (e) => addMessage(JSON.parse(e.data));
  ws.onclose = () => {
    document.getElementById("status").textContent = "قطع شد ❌";
  };
  ws.onerror = () => {
    document.getElementById("status").textContent = "خطا ❌";
  };
}

function addMessage(data) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");

  if (data.type === "system") {
    div.className = "system";
    div.textContent = data.text;
  } else {
    const isMine = data.username === myUsername;
    div.className = "msg " + (isMine ? "mine" : "other");
    const time = new Date(data.timestamp).toLocaleTimeString("fa-IR", {
      hour: "2-digit", minute: "2-digit"
    });
    div.innerHTML = `
      ${isMine ? "" : `<div class="name">${escapeHtml(data.username)}</div>`}
      <div>${escapeHtml(data.text)}</div>
      <div class="time">${time}</div>
    `;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(text) {
  const d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(text);
  input.value = "";
  input.focus();
}

document.getElementById("msg-input").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});
document.getElementById("username").addEventListener("keypress", e => {
  if (e.key === "Enter") startChat();
});
</script>
</body>
</html>
